<!DOCTYPE html>
<html>
<head>
  <title>Todas las Visitas - IP Tracker</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    h1 { color: #333; margin-bottom: 20px; }
    
    .stats-box { 
      background: white; 
      padding: 15px; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    
    .visits-table { 
      width: 100%; 
      background: white; 
      border-radius: 8px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    
    .visits-table th { 
      background: #3498db; 
      color: white; 
      padding: 12px; 
      text-align: left; 
    }
    
    .visits-table td { 
      padding: 10px 12px; 
      border-bottom: 1px solid #eee;
    }
    
    .visits-table tr:hover { background: #f9f9f9; }
    
    .clear-btn {
      background: #e74c3c;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
    }
    
    .clear-btn:hover { background: #c0392b; }
  </style>
</head>
<body>
  <h1>📊 Todas las Visitas Registradas (IP Tracker)</h1>
  
  <!-- Estadísticas -->
  <div class="stats-box">
    <h2>📈 Estadísticas</h2>
    <p><strong>Total de visitas:</strong> <span id="total-visits"></span></p>
    <p><strong>Países únicos:</strong> <span id="unique-countries"></span></p>
  </div>

  <!-- Tabla de Visitas -->
  <table class="visits-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Fecha/Hora</th>
        <th>IP</th>
        <th>Ciudad</th>
        <th>País</th>
        <th>Lat/Lon</th>
      </tr>
    </thead>
    <tbody id="visits-body"></tbody>
  </table>

  <!-- Botón borrar -->
  <button class="clear-btn" onclick="clearAllVisits()">🗑️ Borrar Todas las Visitas</button>

  <script src="geolocation.js"></script>
  <script>
    // Cargar todas las visitas al abrir la página
    document.addEventListener('DOMContentLoaded', async () => {
      const visits = JSON.parse(localStorage.getItem('visitor_visits') || '[]');
      
      if (visits.length === 0) {
        document.getElementById('visits-body').innerHTML = '<tr><td colspan="6" style="text-align: center;">No hay visitas registradas aún</td></tr>';
        return;
      }

      // Ordenar por fecha (más reciente primero)
      visits.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      let total = visits.length;
      
      // Contar países únicos
      const countries = [...new Set(visits.map(v => v.country))];
      document.getElementById('total-visits').textContent = total.toLocaleString();
      document.getElementById('unique-countries').textContent = countries.length.toLocaleString();

      // Renderizar tabla
      let html = '';
      
      visits.forEach((visit, index) => {
        const date = new Date(visit.timestamp).toLocaleString();
        
        html += `
          <tr>
            <td>${index + 1}</td>
            <td>${date}</td>
            <td><strong>${visit.ip || 'N/A'}</strong></td>
            <td>${visit.city || 'N/A'}</td>
            <td>${visit.country || 'N/A'}</td>
            <td>${visit.latitude}, ${visit.longitude}</td>
          </tr>
        `;
      });

      document.getElementById('visits-body').innerHTML = html;
    });

    // Borrar todas las visitas
    function clearAllVisits() {
      if (confirm('¿Estás seguro de borrar TODAS las visitas registradas?')) {
        localStorage.removeItem('visitor_visits');
        location.reload();
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>IP Dashboard</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .ip-box { background: #f5f5f5; padding: 15px; margin: 10px; border-radius: 8px; }
    h1 { color: #333; }
  </style>
</head>
<body>
  <h1>📡 IP Dashboard en Tiempo Real</h1>
  
  <div class="ip-box">
    <h2>Última Visita</h2>
    <p><strong>IP:</strong> <span id="current-ip"></span></p>
    <p><strong>Ciudad:</strong> <span id="current-city"></span></p>
    <p><strong>País:</strong> <span id="current-country"></span></p>
  </div>

  <script src="geolocation.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tracker = new LocationTracker();
      
      // Obtener última ubicación guardada
      const saved = JSON.parse(localStorage.getItem('user_location') || 'null');
      
      if (saved) {
        document.getElementById('current-ip').textContent = saved.ip;
        document.getElementById('current-city').textContent = saved.city;
        document.getElementById('current-country').textContent = saved.country_name;
      } else {
        // Obtener nueva ubicación
        await tracker.getCurrentLocation().then(loc => {
          document.getElementById('current-ip').textContent = loc.ip;
          document.getElementById('current-city').textContent = loc.city;
          document.getElementById('current-country').textContent = loc.country_name;
        });
      }
    });
  </script>
</body>
</html>
